
name: Build Yelp Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract Yelp Launcher
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "No project ZIP found in repository root."
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP" -d source

          SETTINGS_FILE=$(find source -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android Gradle settings file not found."
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$ANDROID_DIR/build.gradle.kts" ]; then
            echo "Android root build.gradle.kts not found."
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Found Android project at: $ANDROID_DIR"

      - name: Install Gradle
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yelp-Launcher-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
